[tool.ruff]
src=["app"]
exclude = [
    ".git",
    ".venv",
    "scripts",
    "docker",
    "staticfiles",
]
target-version = "py311"

[tool.ruff.lint]
select = ["E", "W", "F", "I", "UP"]

ignore = []

[tool.ruff.lint.isort]
known-first-party = ["apps"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
asyncio_default_fixture_loop_scope = "function"
testpaths = ["tests"]
python_files = ["test_*.py", "*_test.py"]

[tool.bandit]
exclude_dirs = ["venv", ".venv", "tests", "docker", "staticfiles", "scripts"]